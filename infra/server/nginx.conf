# Replaces /etc/nginx/nginx.conf. CloudFront terminates TLS and talks HTTP to :80.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server_tokens off;

    # Generated by remote/apply.sh from Secrets Manager: maps the secret header to $yard_origin_ok.
    include /etc/nginx/yard-origin.conf;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Host is not forwarded by CloudFront, so redirects must be relative.
    absolute_redirect off;

    upstream yard_app { server 127.0.0.1:8766; }

    server {
        listen 80 default_server;
        server_name _;
        root /opt/yard/current;

        # Only requests that went through our CloudFront carry the secret header.
        if ($yard_origin_ok = 0) { return 403; }

        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location = /        { return 302 /ui/; }

        # Operator UI + API (compartir_ui.py today; the writable API later).
        location /ui/  { proxy_pass http://yard_app; }
        location /api/ { proxy_pass http://yard_app; }

        # Driver PWA: static files.
        location = /pwa { return 301 /pwa/; }
        location /pwa/ {
            index index.html;
            try_files $uri $uri/index.html =404;
            add_header Cache-Control "no-cache";
        }
        # Types that older mime.types files don't know (default_type only applies when unmapped).
        location ~* ^/pwa/.+\.wasm$        { default_type application/wasm;              try_files $uri =404; add_header Cache-Control "no-cache"; }
        location ~* ^/pwa/.+\.webmanifest$ { default_type application/manifest+json;     try_files $uri =404; add_header Cache-Control "no-cache"; }

        # Everything else (project root, .db, source) is not served.
        location / { return 404; }
    }
}
